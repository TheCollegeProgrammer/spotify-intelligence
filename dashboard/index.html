<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d14" />
    <meta
      name="description"
      content="Spotify Intelligence — a premium analytics workspace for recorded streaming values across five markets."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231db954'/%3E%3Cg fill='none' stroke='%2304140a' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='16' cy='16' r='9'/%3E%3Cpath d='M10.5 19c3.4-1.5 7.4-1.4 11 .4M9.7 15.2c4.3-1.9 9.2-1.7 13.4.6M9.3 11.4c4.8-2.1 10.5-2 14.8.5'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Spotify Intelligence</title>
    <script>
      try {
        var saved = localStorage.getItem("spotify-intel-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (error) {
        /* storage unavailable */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Spotify Intelligence requires JavaScript to render the analytics workspace.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
